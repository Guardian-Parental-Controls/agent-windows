name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and publish (for example v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like vX.Y.Z, got: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  windows-release-build:
    needs: resolve-tag
    runs-on: windows-latest
    steps:
      - name: Check out agent-windows
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Check out agent-common
        uses: actions/checkout@v5
        with:
          repository: Guardian-Parental-Controls/agent-common
          ref: v1.0.0
          path: _agent-common

      - name: Use path patch for common
        shell: bash
        run: |
          mkdir -p .cargo
          printf '%s\n' \
            '[patch."https://github.com/Guardian-Parental-Controls/agent-common"]' \
            'guardian-agent-common = { path = "_agent-common" }' \
            > .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64-pc-windows-msvc

      - name: Build release binary
        shell: bash
        env:
          GUARDIAN_AGENT_VERSION: ${{ needs.resolve-tag.outputs.tag }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: cargo build --release --bin guardian-agent --target x86_64-pc-windows-msvc

      - name: Install WiX Toolset 3
        shell: bash
        run: choco install wixtoolset --version=3.14.1 -y --no-progress

      - name: Compile MSI installer
        shell: bash
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Unusable MSI version from tag ${TAG}" >&2
            exit 1
          fi
          cp overlay_resources/blockedv2.html \
            target/x86_64-pc-windows-msvc/release/blockedv2.html

          wix_bin=""
          for candidate in \
            "/c/Program Files (x86)/WiX Toolset v3.14/bin" \
            "/c/Program Files (x86)/WiX Toolset v3.11/bin"
          do
            if [[ -x "${candidate}/candle.exe" ]]; then
              wix_bin="$candidate"
              break
            fi
          done
          if [[ -z "$wix_bin" && -n "${WIX:-}" ]]; then
            wix_bin="$(echo "${WIX}bin" | tr '\\' '/')"
          fi
          [[ -x "${wix_bin}/candle.exe" ]] || {
            echo "WiX candle.exe not found" >&2
            exit 1
          }

          "${wix_bin}/candle.exe" \
            -dVersion="$VERSION" \
            -dSourceDir="target/x86_64-pc-windows-msvc/release" \
            -o guardian-agent.wixobj \
            guardian-agent.wxs
          "${wix_bin}/light.exe" \
            -ext WixUIExtension \
            -o dist/guardian-agent-x86_64-pc-windows-msvc.msi \
            guardian-agent.wixobj
          sha256sum dist/guardian-agent-x86_64-pc-windows-msvc.msi \
            | awk '{print $1}' \
            > dist/guardian-agent-x86_64-pc-windows-msvc.msi.sha256

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: guardian-windows-agent-msi
          path: |
            dist/guardian-agent-x86_64-pc-windows-msvc.msi
            dist/guardian-agent-x86_64-pc-windows-msvc.msi.sha256

  publish-release:
    needs: [resolve-tag, windows-release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download windows agent assets
        uses: actions/download-artifact@v4
        with:
          name: guardian-windows-agent-msi
          path: dist

      - name: Verify artifacts
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la dist
          test -s dist/guardian-agent-x86_64-pc-windows-msvc.msi
          test -s dist/guardian-agent-x86_64-pc-windows-msvc.msi.sha256
          python3 - "$TAG" <<'PY'
          import json
          import sys
          tag = sys.argv[1]
          version = tag.lstrip("v")
          base = f"https://github.com/Guardian-Parental-Controls/agent-windows/releases/download/{tag}"
          payload = {
              "event_type": "component-release",
              "client_payload": {
                  "component": "agent-windows",
                  "version": version,
                  "repository": "https://github.com/Guardian-Parental-Controls/agent-windows",
                  "minimum_supported_version": "1.0.0",
                  "min_server": "1.0.0",
                  "protocol_version": 1,
                  "artifacts": [
                      {
                          "id": "windows-x86_64",
                          "url": f"{base}/guardian-agent-x86_64-pc-windows-msvc.msi",
                          "checksum_url": f"{base}/guardian-agent-x86_64-pc-windows-msvc.msi.sha256",
                      }
                  ],
              },
          }
          open("/tmp/versions-dispatch.json", "w", encoding="utf-8").write(
              json.dumps(payload, indent=2) + "\n"
          )
          PY

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

      - name: Create versions automation token
        id: versions-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GUARDIAN_VERSIONS_APP_ID }}
          private-key: ${{ secrets.GUARDIAN_VERSIONS_PRIVATE_KEY }}
          owner: Guardian-Parental-Controls
          repositories: versions

      - name: Publish agent-windows version
        if: steps.versions-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.versions-token.outputs.token }}
        run: |
          gh api repos/Guardian-Parental-Controls/versions/dispatches \
            --method POST \
            --input /tmp/versions-dispatch.json
